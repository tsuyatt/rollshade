name: Bug report
description: Something in the rollshade package does not work as documented
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: rollshade, three, browser and OS. Say whether it runs on WebGPU or the WebGL2 fallback.
      placeholder: rollshade 0.1.0, three 0.186.0, Chrome 140 on macOS, WebGPU
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: The smallest code that shows it helps most. Console errors too.
    validations:
      required: true
